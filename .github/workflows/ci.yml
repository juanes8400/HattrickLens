name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    # Para todos los pasos: las pruebas las necesitan para arrancar la
    # configuración, y las migraciones, para saber a qué base hablar.
    env:
      DATABASE_URL: postgresql+asyncpg://hattricklens:hattricklens@localhost:5432/hattricklens_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test
      # TOKEN_ENCRYPTION_KEY no va escrita aquí: la genera el primer paso.
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: hattricklens, POSTGRES_PASSWORD: hattricklens, POSTGRES_DB: hattricklens_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hattricklens" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      # UNA CLAVE DE USAR Y TIRAR en cada ejecución (2026-11-15). Antes iba
      # escrita en este fichero: era de prueba («clave-de-prueba-de-CI-no-real»)
      # pero tenía forma de clave Fernet, y en un repositorio público cualquier
      # escáner de secretos la daba por filtrada. Fernet exige 32 bytes en
      # base64 urlsafe; se enmascara para que no salga en el registro.
      - name: Clave de cifrado de usar y tirar
        run: |
          clave=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          echo "::add-mask::$clave"
          echo "TOKEN_ENCRYPTION_KEY=$clave" >> "$GITHUB_ENV"
      # La misma versión de `uv` que copia el Dockerfile de la raíz.
      - uses: astral-sh/setup-uv@v4
        with: {version: "0.13.7"}
      # `--locked`: se instala lo que dice `uv.lock` (y el Python de
      # `.python-version`, el 3.12 de producción), y el trabajo falla si alguien
      # tocó `pyproject.toml` sin regenerar el lock. Antes era `uv sync` a
      # secas: cada ejecución resolvía las versiones del día, así que lo que se
      # probaba aquí no era lo que se desplegaba.
      - run: uv sync --locked
      - run: uv run ruff check app
      - run: uv run ruff format --check app
      - run: uv run mypy app/domain app/application
      - run: uv run pytest -q --cov=app --cov-fail-under=80
      # LAS MIGRACIONES, CONTRA UN POSTGRES DE VERDAD (2026-11-14). Las pruebas
      # montan SQLite en memoria y nunca tocan este Postgres, que estaba
      # levantado sin que nadie le hablara. Y producción arranca con
      # `alembic upgrade head`: una migración que sólo falla en Postgres
      # (un tipo, un ALTER que SQLite no hace igual) se descubría al
      # desplegar, con el servicio caído. Subir, bajar una y volver a subir
      # comprueba además que la última migración sabe deshacerse.
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1
      - run: uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # LAS PRUEBAS Y EL FORMATO ENTRAN AL CI EL 2026-11-03, pedido del
      # usuario. Hasta hoy este trabajo corria lint, typecheck y build, de modo
      # que las 263 pruebas del frontend y prettier solo se comprobaban en el
      # portatil de quien subia el cambio. El dia que `main` se protegio con
      # estos dos trabajos como obligatorios, la proteccion prometia mas de lo
      # que medía.
      #
      # `test:ci` es `vitest run`: `vitest` a secas se queda vigilando ficheros
      # y el trabajo no terminaria nunca.
      - run: npm run test:ci
      - run: npm run format:check
      - run: npm run build

  # LO QUE SE DESPLIEGA, CONSTRUIDO EN CADA PR (2026-11-14). Render construye
  # el Dockerfile de la RAÍZ: el frontend compilado y la API en una sola
  # imagen. Este trabajo construía `backend/Dockerfile` y `frontend/Dockerfile`
  # --los del docker-compose local, que no despliega nadie-- y sólo al llegar
  # a `main`, o sea cuando ya era tarde. Ahora construye el de verdad antes
  # de fusionar, y no publica nada: Render construye su propia imagen.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., file: Dockerfile, push: false}
