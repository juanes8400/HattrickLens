<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="autor-titulo">
  <title id="autor-titulo">Retrato del autor de HT Lens</title>
  <!--
    Estilo de las caras de jugador de Hattrick, que es la referencia que pasó
    el usuario. Lo que define ese estilo y se copia aquí:

      cara muy alargada y estrecha, casi rectangular, de mentón corto;
      orejas grandes y bien separadas de la cabeza;
      ojos blancos grandes con la pupila pequeña y oscura;
      cejas gruesas pegadas al ojo, que son las que ponen el gesto;
      nariz larga resuelta con dos trazos, sin volumen;
      boca pequeña, una línea;
      contorno negro grueso y algo irregular, colores planos, cero sombras.

    De la foto se conservan los rasgos que lo identifican: pelo negro corto con
    raya a su izquierda, cejas rectas y juntas de gesto serio, nariz recta y
    larga, boca cerrada, americana azul marino sobre camisa celeste con el
    cuello abierto. El fondo azul claro es el de la propia ilustración de
    Hattrick.
  -->
  <defs>
    <clipPath id="autor-circulo"><circle cx="100" cy="100" r="94" /></clipPath>
  </defs>

  <g clip-path="url(#autor-circulo)">
    <rect width="200" height="200" fill="#a8d8f0" />
    <path d="M0 40l200-30v26L0 66z" fill="#7cc3e8" opacity="0.7" />
    <path d="M0 92l200-30v26L0 118z" fill="#7cc3e8" opacity="0.7" />

    <!-- Hombros y americana. -->
    <path d="M14 200c1-34 26-52 86-52s85 18 86 52z" fill="#25325a" stroke="#000" stroke-width="6" stroke-linejoin="round" />
    <path d="M84 150l16 26 16-26-16-8z" fill="#d6e8f8" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <path d="M84 150l-12 50 22-30z" fill="#1a2442" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <path d="M116 150l12 50-22-30z" fill="#1a2442" stroke="#000" stroke-width="5" stroke-linejoin="round" />

    <!-- Cuello, fino como en la referencia. -->
    <path d="M90 128h20v24c0 7-20 7-20 0z" fill="#d99a68" stroke="#000" stroke-width="6" stroke-linejoin="round" />

    <!-- Orejas: grandes y separadas, se dibujan ANTES de la cara para que el
         contorno de ésta las recorte por dentro. -->
    <path d="M67 84c-11-3-15 6-11 15 4 8 11 10 14 6z" fill="#eeb684" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <path d="M133 84c11-3 15 6 11 15-4 8-11 10-14 6z" fill="#eeb684" stroke="#000" stroke-width="5" stroke-linejoin="round" />

    <!-- Cara: alargada y estrecha, lados casi rectos, mentón corto. -->
    <path d="M100 24c19 0 32 9 32 26v56c0 24-13 38-32 38S68 130 68 106V50c0-17 13-26 32-26z" fill="#eeb684" stroke="#000" stroke-width="6" stroke-linejoin="round" />

    <!-- Pelo: casquete corto con la raya a su izquierda (nuestra derecha). -->
    <path d="M68 52c0-19 14-28 32-28s32 9 32 28c0-8-3-13-7-16-13 10-38 12-49 4-5 3-8 7-8 12z" fill="#17161a" stroke="#000" stroke-width="6" stroke-linejoin="round" />
    <!-- Mechones, como los trazos sueltos de la ilustración. -->
    <path d="M86 32c6 5 16 7 26 5" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" opacity="0.55" />
    <path d="M112 28c4 4 6 8 7 13" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" opacity="0.55" />

    <!-- Cejas gruesas, rectas y juntas: el gesto serio de la foto. -->
    <path d="M78 76c7-4 15-4 20-1" fill="none" stroke="#17161a" stroke-width="7" stroke-linecap="round" />
    <path d="M122 76c-7-4-15-4-20-1" fill="none" stroke="#17161a" stroke-width="7" stroke-linecap="round" />

    <!-- Ojos grandes y blancos con pupila pequeña. -->
    <ellipse cx="87" cy="90" rx="10" ry="11" fill="#fff" stroke="#000" stroke-width="4" />
    <ellipse cx="113" cy="90" rx="10" ry="11" fill="#fff" stroke="#000" stroke-width="4" />
    <circle cx="88" cy="91" r="4" fill="#17161a" />
    <circle cx="112" cy="91" r="4" fill="#17161a" />

    <!-- Nariz larga, dos trazos. -->
    <path d="M100 98v22" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" />
    <path d="M100 120c-5 0-7-2-8-4" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" />

    <!-- Boca pequeña y recta. -->
    <path d="M92 134h16" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" />
  </g>

  <circle cx="100" cy="100" r="94" fill="none" stroke="#000" stroke-width="6" />
</svg>
