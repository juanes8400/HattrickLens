<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="autor-titulo">
  <title id="autor-titulo">Retrato del autor de HT Lens</title>
  <!--
    Caricatura, no retrato: colores planos y contorno negro, como el logo.

    Los rasgos salen de la foto que pasó el usuario y son los que hacen que se
    reconozca: cara alargada de mandíbula marcada, pelo negro corto con raya a
    su izquierda y el flequillo peinado hacia el otro lado, cejas rectas y
    juntas (el gesto es serio, algo fruncido), nariz recta y larga, boca
    cerrada sin sonrisa, sombra de barba. Americana azul marino y camisa
    celeste con el cuello abierto, sin corbata.
  -->
  <defs>
    <clipPath id="autor-circulo"><circle cx="100" cy="100" r="94" /></clipPath>
  </defs>

  <g clip-path="url(#autor-circulo)">
    <rect width="200" height="200" fill="#e9e7e4" />

    <!-- Hombros y americana, bastante anchos como en la foto. -->
    <path d="M8 200c2-40 30-60 92-60s90 20 92 60z" fill="#232f4d" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <!-- Camisa celeste: cuello abierto en V. -->
    <path d="M80 143l20 30 20-30-20-9z" fill="#d9e8f6" stroke="#000" stroke-width="4" stroke-linejoin="round" />
    <!-- Solapas, largas y estrechas. -->
    <path d="M80 143l-13 57 25-33z" fill="#1a2440" stroke="#000" stroke-width="4" stroke-linejoin="round" />
    <path d="M120 143l13 57-25-33z" fill="#1a2440" stroke="#000" stroke-width="4" stroke-linejoin="round" />
    <!-- Puntas del cuello de la camisa. -->
    <path d="M86 139l8 14-12 6z" fill="#eef5fc" stroke="#000" stroke-width="3" stroke-linejoin="round" />
    <path d="M114 139l-8 14 12 6z" fill="#eef5fc" stroke="#000" stroke-width="3" stroke-linejoin="round" />

    <!-- Cuello. -->
    <path d="M86 112h28v28c0 9-28 9-28 0z" fill="#dda474" stroke="#000" stroke-width="5" stroke-linejoin="round" />

    <!-- Cara: más larga que ancha, con la mandíbula marcada y el mentón
         cuadrado, no redondo. -->
    <path d="M100 26c24 0 37 16 37 40 0 14-2 26-7 36-5 11-15 21-30 21s-25-10-30-21c-5-10-7-22-7-36 0-24 13-40 37-40z" fill="#eeb684" stroke="#000" stroke-width="5" stroke-linejoin="round" />

    <!-- Sombra de barba: mentón y mandíbula. -->
    <path d="M74 100c3 14 8 24 14 30 4 4 8 6 12 6s8-2 12-6c6-6 11-16 14-30-4 12-13 18-26 18s-22-6-26-18z" fill="#c98f63" opacity="0.55" />

    <!-- Orejas. -->
    <path d="M63 72c-7-1-9 6-6 12s7 8 9 6z" fill="#dda474" stroke="#000" stroke-width="4" stroke-linejoin="round" />
    <path d="M137 72c7-1 9 6 6 12s-7 8-9 6z" fill="#dda474" stroke="#000" stroke-width="4" stroke-linejoin="round" />

    <!-- Pelo: raya a su izquierda (nuestra derecha), volumen arriba y peinado
         hacia el lado. Entradas suaves, patillas cortas. -->
    <path d="M63 70c-3-30 15-46 37-46 21 0 40 15 37 46-3-11-7-18-12-22-14 9-40 11-52 3-5 4-8 11-10 19z" fill="#191a1f" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <!-- La raya, marcada como un trazo del mismo negro sobre la frente. -->
    <path d="M118 30c-6 6-9 12-10 19" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M65 78l2 12" fill="none" stroke="#191a1f" stroke-width="6" stroke-linecap="round" />
    <path d="M135 78l-2 12" fill="none" stroke="#191a1f" stroke-width="6" stroke-linecap="round" />

    <!-- Cejas rectas, gruesas y algo juntas: es lo que da el gesto serio. -->
    <path d="M76 73c7-3 15-3 20 0" fill="none" stroke="#191a1f" stroke-width="7" stroke-linecap="round" />
    <path d="M124 73c-7-3-15-3-20 0" fill="none" stroke="#191a1f" stroke-width="7" stroke-linecap="round" />

    <!-- Ojos, oscuros y algo hundidos. -->
    <path d="M79 85c4-4 11-4 15 0" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" />
    <path d="M121 85c-4-4-11-4-15 0" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="86" cy="88" r="4.5" fill="#3a2418" />
    <circle cx="114" cy="88" r="4.5" fill="#3a2418" />

    <!-- Nariz recta y larga. -->
    <path d="M100 88v18l-6 5" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Boca cerrada, recta, sin sonrisa. -->
    <path d="M89 122h22" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <circle cx="100" cy="100" r="94" fill="none" stroke="#000" stroke-width="6" />
</svg>
