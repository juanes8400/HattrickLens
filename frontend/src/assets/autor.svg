<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="autor-titulo">
  <title id="autor-titulo">Retrato del autor de HT Lens</title>
  <!--
    Segunda versión, con la ilustración de referencia que mandó el usuario
    delante (2026-09-02). La primera se pareció a la idea equivocada: cabeza
    de pera con las sienes anchas y ojos enormes y blancos. La referencia
    real es lo contrario, rasgo a rasgo:

      la cara es LARGA y ESTRECHA, casi igual de ancha arriba que abajo, y
      acaba en un mentón corto y redondeado;
      los ojos son PEQUEÑOS, poco más que una almendra con un punto dentro,
      y están altos, muy cerca del puente de la nariz;
      las cejas son finas, cortas y arqueadas;
      la nariz es el rasgo dominante: nace entre las cejas, baja larguísima
      por el centro, se ensancha hasta un bulbo y termina en gancho, con la
      cara sombreada a un lado;
      la boca es pequeña, con labios dibujados y una caída seria;
      las orejas son pequeñas y pegadas, a la altura de los ojos;
      el pelo es un casquete oscuro de mechones picudos con el flequillo
      dentado sobre la frente;
      contorno negro grueso, color plano, ninguna sombra salvo la nariz.

    De la foto se conservan la ropa (americana azul marino sobre camisa
    celeste, cuello abierto) y el pelo negro con la raya a su izquierda.
  -->
  <defs>
    <clipPath id="autor-circulo"><circle cx="100" cy="100" r="94" /></clipPath>
  </defs>

  <g clip-path="url(#autor-circulo)">
    <rect width="200" height="200" fill="#a9d9f2" />
    <path d="M0 34l200-28v24L0 60z" fill="#79c2e9" opacity="0.65" />
    <path d="M0 88l200-28v24L0 114z" fill="#79c2e9" opacity="0.65" />

    <!-- Hombros. -->
    <path d="M12 200c3-28 27-44 88-44s85 16 88 44z" fill="#25325a" stroke="#000" stroke-width="6" stroke-linejoin="round" />
    <path d="M86 158l14 22 14-22-14-6z" fill="#d8e9f8" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <path d="M86 158l-11 42 20-25z" fill="#1a2442" stroke="#000" stroke-width="5" stroke-linejoin="round" />
    <path d="M114 158l11 42-20-25z" fill="#1a2442" stroke="#000" stroke-width="5" stroke-linejoin="round" />

    <!-- Cuello. -->
    <path d="M92 132h16v26c0 6-16 6-16 0z" fill="#d69564" stroke="#000" stroke-width="6" stroke-linejoin="round" />

    <!-- Orejas pequeñas y pegadas, a la altura de los ojos. -->
    <path d="M72 78c-7-2-10 5-8 12 2 6 6 8 8 5z" fill="#e8b48c" stroke="#000" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M128 78c7-2 10 5 8 12-2 6-6 8-8 5z" fill="#e8b48c" stroke="#000" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Cara larga y estrecha, mentón corto. -->
    <path d="M100 24c17 0 29 13 30 34 1 22-2 44-9 60-5 12-12 18-21 18s-16-6-21-18c-7-16-10-38-9-60 1-21 13-34 30-34z" fill="#e8b48c" stroke="#000" stroke-width="6" stroke-linejoin="round" />

    <!-- Pelo: casquete de mechones picudos, flequillo dentado, raya a su izquierda. -->
    <path d="M70 62c-1-24 12-40 30-40s31 16 30 40c-1-6-3-11-6-15l3-11-9 9-2-12-8 11-5-13-7 13-8-9-2 11-8-6 1 10c-4 3-7 7-9 12z" fill="#241c18" stroke="#000" stroke-width="5.5" stroke-linejoin="round" />

    <!-- Cejas finas, cortas y arqueadas. -->
    <path d="M80 70c4-4 10-4 13-1" fill="none" stroke="#241c18" stroke-width="4" stroke-linecap="round" />
    <path d="M120 70c-4-4-10-4-13-1" fill="none" stroke="#241c18" stroke-width="4" stroke-linecap="round" />

    <!-- Ojos pequeños, altos y juntos. -->
    <path d="M80 82c3-4 9-4 12 0-3 4-9 4-12 0z" fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M108 82c3-4 9-4 12 0-3 4-9 4-12 0z" fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="87" cy="82" r="2.6" fill="#17161a" />
    <circle cx="113" cy="82" r="2.6" fill="#17161a" />

    <!-- Nariz: el rasgo que manda. Baja desde las cejas, se ensancha y engancha. -->
    <path d="M99 68c4 14 8 30 6 40-2 9-11 12-17 6 7-2 11-10 9-22-1-8-1-17 2-24z" fill="#d69564" stroke="none" opacity="0.55" />
    <path d="M99 68c4 14 8 30 6 40-2 9-11 12-17 6" fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M88 114c4-1 9-2 12-6" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" />

    <!-- Boca pequeña, con labios y gesto serio. -->
    <path d="M91 130c5-4 13-4 18 0-5 5-13 5-18 0z" fill="#c9765f" stroke="#000" stroke-width="4" stroke-linejoin="round" />
  </g>

  <circle cx="100" cy="100" r="94" fill="none" stroke="#000" stroke-width="6" />
</svg>
