# Training constants — public HT-Tools community formula
#
# Clean-room implementation of the mathematics published by HT-Tools and used
# by HT Utilities. These are community estimates, not Hattrick server code and
# not coefficients fitted from this manager's private account data.

reference:
  implementation: HT-Tools community training formula
  status: ported
  source_files:
    - https://github.com/ventouris/hattricktools/blob/master/static/js/training.js
    - https://wiki.hattrick.org/wiki/Training
  recovered: "Función por tramos del nivel, reloj de edad, coeficientes de entrenamiento, entrenador, ayudantes, intensidad y resistencia."
  pending: "El subnivel exacto no se publica y la tabla pública de edad termina en 34; Lens declara ambos límites."
  numeric_profile: HT-Tools community estimate; no private-data fitting
#
# FORMULA
#
#   K = K_training × K_coach × K_assistants × intensity
#       × (1 − stamina_share) × exposure
#
#   F(s) = (s^1.72 − 1) / (6.0896 × 1.72)                      if s < 9
#        = 2.45426 + (s − 5)^1.96 / (4.7371 × 1.96)            if s >= 9
#
#   pop_clock = age_clock(age) + (F(next_level) − F(current_skill)) / K
#   weeks = 16 × (inverse_age_clock(pop_clock) − age)
#
# Coefficient of each senior-team training mode in the public implementation.
training_coefficients:
  goalkeeping: 0.335
  defending: 0.206
  defensive_positions: 0.094
  winger: 0.315
  winger_partial: 0.1575
  wing_attacks: 0.219
  playmaking: 0.220
  playmaking_partial: 0.110
  scoring: 0.218
  shooting: 0.097
  short_passes: 0.237
  through_passes: 0.178
  set_pieces: 0.941
  set_pieces_bonus: 1.183

# CHPP trainingType → public formula mode.
training_type_to_mode:
  2: set_pieces
  3: defending
  4: scoring
  5: winger
  6: shooting
  7: short_passes
  8: playmaking
  9: goalkeeping
  10: through_passes
  11: defensive_positions
  12: wing_attacks

# Mode used when the user explores a skill other than the currently synced
# training. Stamina is intentionally absent: the formula models technical
# senior-team training, while stamina has its own reference engine.
default_training_mode_by_skill:
  keeper: goalkeeping
  defending: defending
  playmaking: playmaking
  passing: short_passes
  winger: winger
  scoring: scoring
  set_pieces: set_pieces

# Accumulated age clock for exact Hattrick ages 17..34. Between birthdays Lens
# interpolates linearly. Above 34 it extrapolates the last published segment and
# marks that limitation in model metadata.
age_clock:
  start_age: 17
  values: [0.000, 16.000, 31.704, 47.117, 62.246, 77.094, 91.668, 105.972, 120.012, 133.791, 147.316, 160.591, 173.620, 186.408, 198.960, 211.279, 223.370, 235.238]
age_speed_coefficients: [1.000, 0.982, 0.963, 0.946, 0.928, 0.911, 0.894, 0.877, 0.861, 0.845, 0.830, 0.814, 0.799, 0.784, 0.770, 0.756, 0.742, 0.728]

skill_curve:
  split_level: 9
  low_power: 1.72
  low_scale: 6.0896
  high_offset: 2.45426
  high_shift: 5
  high_power: 1.96
  high_scale: 4.7371

# Assistant coefficient from the public HT-Tools formula.
max_assistants: 2
max_assistant_level: 5
assistant_base_coefficient: 0.66
assistant_bonus_per_level: 0.032
assistant_level_sum_cap: 10        # 2 assistants × level 5
default_assistant_level_sum: 10

# Formula scale 4..8. stafflist.xml exposes 1..5 and the mapping below converts
# it directly. Leadership does not affect training speed.
coach_coefficients:
  4: 0.774
  5: 0.867
  6: 0.943
  7: 1.000
  8: 1.045

apply_stamina_share: true
default_stamina_share: 12.5

# Minutes and position. 90 minutes in the trained position is full training.
full_training_minutes: 90
position_training_share:
  full: 1.0
  partial: 0.5
  none: 0.0

# Youth training exposure weights. The secondary slot normally gives 2/3;
# repeating the exact same training halves that secondary contribution.
youth_exposure:
  primary_training: 1.0
  secondary_training: 0.6666666667
  repeated_secondary_training: 0.3333333333
  primary_position: 1.0
  secondary_position: 0.5
  official_match: 1.0
  friendly_match: 0.5

# ── Cierre de la fórmula: correspondencias con los datos reales del CHPP ──────
#
# Estas tablas traducen valores leídos de la API a los términos de la fórmula.
# Se mantienen visibles y configurables para que el tipo CHPP que alimenta
# cada modo matemático nunca quede escondido.

# SkillID de trainingevents → habilidad interna. Confirmado contra CHPP DataTypes.
skill_id_map:
  1: keeper
  2: stamina
  3: set_pieces
  4: defending
  5: scoring
  6: winger
  7: passing
  8: playmaking
  9: trainer
  10: leadership
  11: experience

# TrainingType (leído de training.TrainingType) → habilidad que entrena.
# Confirmado contra la tabla de traducción oficial (translations.xml).
training_type_to_skill:
  1: stamina
  2: set_pieces
  3: defending
  4: scoring
  5: winger
  6: scoring          # "Anotación y balón parado": primaria anotación
  7: passing
  8: playmaking
  9: keeper
  10: passing         # "Pases (Defensas y centro del campo completo)"
  11: defending
  12: winger

# TrainerSkillLevel (1–5 en stafflist) → escala 4–8 usada por la fórmula
# pública. Es un desplazamiento directo: 1→4, ..., 5→8.
trainer_skill_to_formula_level:
  1: 4
  2: 5
  3: 6
  4: 7
  5: 8
# Se conserva para compatibilidad de la respuesta; el coeficiente del nivel 8
# ya incorpora el efecto y el motor no aplica un segundo bono.
excellent_trainer_skill_level: 5
