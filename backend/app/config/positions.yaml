# Matrices de aporte posicional — Manual no Escrito de Hattrick
#
# Fuente operativa: https://wiki.hattrick.org/wiki/Manual_no_Escrito
# Las cifras son las contribuciones relativas publicadas por puesto y orden
# individual. No se ajustan contra estrellas ni observaciones de Hattrick
# Control. Cada rol declara a qué sector aporta cada habilidad, de modo que
# el motor puede explicar tanto el índice como sus efectos tácticos.
#
# Los sectores laterales representan el costado propio del jugador. La
# alineación futura conserva el lado real y aplicará las penalizaciones por
# superpoblación que también enumera el Manual.

source:
  name: Manual no Escrito
  url: https://wiki.hattrick.org/wiki/Manual_no_Escrito
  type: community-research
  matrix: relative-position-contributions

reference:
  implementation: Hattrick Control 3.50.02.1619
  status: structural
  source_files: [UEquipo.pas, UEquipo.dfm]
  recovered: "Entradas de la calculadora y los 19 roles de posición."
  pending: "Matriz numérica de la rutina auxiliar de HallarFormulas."

# Factores individuales del Manual no Escrito, aplicados a las habilidades de
# campo antes de multiplicarlas por cada contribución posicional.
adjustments:
  form: "((forma - 0.5) / 7) ^ 0.45"
  stamina: "((condicion + 6.5) / 14) ^ 0.6"
  experience: "ln(experiencia) * 4 / 3, sumado a cada habilidad"
  loyalty: "nivel_de_fidelidad / 19, sumado a cada habilidad"

