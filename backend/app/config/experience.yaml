# Experience constants — Hattrick Control compatible profile
# The accumulation and percentage flow is ported from UExperiencia.pas
# (Suma / Porcentaje). The controls make match weights and the threshold an
# editable profile, not hidden game constants. See
# docs/reference/HATTRICK_CONTROL_3_50_REVERSE_ENGINEERING.md.

reference:
  implementation: Herramienta comunitaria de escritorio 3.50.02.1619
  status: ported
  source_files: [UExperiencia.pas, UExperiencia.dfm]
  recovered: "Suma ponderada por tipo de partido y porcentaje puntos × 100 / umbral."
  pending: "Perfil por defecto exacto que tenía el usuario en su herramienta anterior."
  # 2026-08-05: valores reales cotejados contra
  # docs/reference/tabla_experiencia.html (ver nota de abajo).
  cross_check: docs/reference/tabla_experiencia.html
#
# 2026-08-05, cotejado contra docs/reference/tabla_experiencia.html (tabla
# real de Hattrick, puntos de experiencia por tipo de encuentro): esos
# valores son EXACTAMENTE los de abajo multiplicados por 3.5 en cada
# categoría que ambas fuentes comparten (liga 1.0→3.5, amistoso 0.1→0.35,
# amistoso internacional 0.2→0.7, copa/promoción 2.0→7.0) — la misma
# proporción entre tipos de partido que ya estaba verificada contra Hattrick
# Control, solo en otra escala. El usuario confirmó en vivo que el umbral
# real en esa escala es 100 puntos por nivel (no 98 = 28×3.5): se adopta esa
# tabla como la escala canónica de aquí en adelante — points_per_level pasa
# de 28 a 100 y match_points pasa a los valores reales de la tabla.
points_per_level: 100

# Calibration. Below this many observed level-ups the configured value stands:
# a mean over one or two samples is not evidence. Above it, the engine reports
# the observed mean and its standard deviation instead.
min_observations_to_calibrate: 5
# Cifra que Hattrick Control reportaba en la escala ANTERIOR (26.3 sobre un
# umbral de 28) — llevada a la escala nueva (×3.5) solo como referencia
# histórica; calibrate() nunca lee esta clave, recalcula la media observada
# desde cero con match_points ya en la escala nueva.
points_per_level_observed_in_hc: 92.05

# Experience points by match type — valores reales de Hattrick (tabla
# `docs/reference/tabla_experiencia.html`). `league` y `friendly_international`
# son los dos verificados contra Hattrick Control (ver model_info().verified);
# el resto sale de la tabla oficial pero no tiene todavía observaciones
# propias que lo confirmen contra un jugador real de esta cuenta.
match_points:
  friendly: 0.35
  friendly_international: 0.7
  league: 3.5
  qualification: 7.0        # Partido de promoción
  cup: 7.0                  # Copa principal nacional o divisional
  cup_secondary: 1.75      # Challenger y Consolación (CupLevel 2/3 en CHPP)
  tournament: 0.0            # Escaleras/Duelos/torneos: no oficiales, no dan experiencia
  masters: 17.5              # Partido HT Masters
  national_team_friendly: 3.5   # Amistoso de selecciones
  # 2026-08-22, decidido explicitamente: la tabla oficial detalla el puntaje
  # por competicion y ronda (Mundial 28, su final 56, Copa de Naciones 7...)
  # pero CHPP solo distingue dos codigos, 10 y 11, y no publica de que
  # competicion es cada partido. Se adoptan estos dos valores y se suman como
  # cualquier otro: la alternativa no era un numero mejor, era ninguno --esos
  # partidos desaparecian del conteo.
  national_team_competitive: 14        # Seleccion, reglas normales
  national_team_competitive_cup: 28    # Seleccion, reglas de copa
  youth_league: 3.5          # Partido de liga juvenil
  youth_friendly: 0.35       # Amistoso juvenil

# Categorías reales de la tabla que CHPP no permite atribuir hoy a un
# match_type concreto (Selección nacional competitiva = MatchType 10/11 es
# UN solo código para Mundial/Copa continental/Copa de Naciones y sus rondas
# de eliminatoria, cada una con puntaje distinto) — documentadas aquí para
# que quede constancia de la tabla completa, pero fuera de `match_points`
# porque asignarles un valor sería inventar un número, no medirlo. Ver
# `player_history.py` (MATCH_TYPE_TO_EXPERIENCE_CATEGORY) y su detección de
# "partido de selección competitivo visto pero no puntuado".
unscored_reference:
  national_team_world_cup: 28               # Partido Mundial
  national_team_world_cup_semifinal_final: 56  # Mundial (semifinal y final)
  national_team_world_cup_qualifier: 14     # Mundial (repesca)
  national_team_continental_cup: 14         # Copas continentales
  national_team_continental_cup_knockout: 21  # Copas continentales (cuartos/semi/final)
  national_team_nations_cup: 7              # Copa de Naciones
  national_team_nations_cup_qualifier: 14   # Copa de Naciones (eliminatoria)
  national_team_old_world_cup: 35           # (Antiguo) Partido de Mundial
  national_team_old_world_cup_final: 70     # (Antiguo) Partido de final del Mundial
  national_team_old_friendly: 7             # (Antiguo) Amistosos de selecciones nacionales
  challenger_league: 7                      # Liga de Aspirantes (sin match_type CHPP conocido)

# Only matches played since the last experience increase count.
reset_on_level_up: true
