[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "hattrick-lens-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "authlib>=1.3",
    "httpx>=0.27",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "lxml>=5.2",
    "defusedxml>=0.7",
    "numpy>=2.0",
    "structlog>=24.0",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0",
    # SQLite asincrono: lo usan 75 de los ficheros de prueba para montar
    # una base en memoria. Aqui estaba instalado de rebote, pero al no
    # declararlo, en CI faltaba y la suite ENTERA moria: 250 fallos y 93
    # errores, todos el mismo ModuleNotFoundError.
    "aiosqlite>=0.20",
    "hypothesis>=6.100", "httpx>=0.27", "testcontainers[postgres]>=4.8",
    "ruff>=0.6", "mypy>=1.11", "factory-boy>=3.3", "import-linter>=2.0",
    # Los tipos de PyYAML: sin ellos mypy no puede leer los tres motores
    # que cargan su configuracion de un .yaml.
    "types-PyYAML>=6.0",
    # Analisis del modelo de prediccion: p-valores y pseudo-R2 los da
    # statsmodels, el AUC scikit-learn. Van en dev y NO en las dependencias de
    # produccion a proposito: entre las dos y sus dependencias pesan cientos de
    # megas, y la imagen que se despliega no ajusta modelos --solo aplica los
    # coeficientes ya calculados, que es aritmetica--.
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI idiom relies on calls in argument defaults (Depends/Query/...).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# celery no trae stubs ni marcador py.typed.
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# types-Authlib no modela la variante async/httpx del cliente OAuth1; el
# propio adapter es el único consumidor de esos atributos.
module = "app.infrastructure.chpp.client"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# @celery.task es una fábrica de decoradores sin stub preciso; el problema
# vive en la firma de celery, no en las tasks que la usan.
module = "app.workers.tasks.sync_tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "seguridad: comprueba el aislamiento entre usuarios, con las dependencias reales",
]

[tool.importlinter]
root_package = "app"

# El invariante real es la pureza del dominio: los motores (domain/engines) no
# saben nada de FastAPI, SQLAlchemy, Celery ni CHPP, y eso es lo que los hace
# testeables sin infraestructura y reutilizables desde el prototipo o desde
# cualquier otro cliente. Una contract de "capas" estricta sobre toda la app
# (api/workers → infra → application → domain) sonaba mejor sobre el papel,
# pero nunca fue cierta: cada query service lee `app.infrastructure.db.models`
# a propósito (son el lado de lectura CQRS, no motores de negocio), y la API
# dispara tareas de Celery a propósito (`teams.py` → `sync_tasks`). Codificar
# esa aspiración como contrato solo habría escondido incumplimientos reales
# detrás de un check verde falso — así que el contrato ahora protege lo que de
# verdad hay que proteger.
[[tool.importlinter.contracts]]
name = "El dominio no depende de nada"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application", "app.infrastructure", "app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "La infraestructura no depende de la API ni de los workers"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.api", "app.workers"]

[[tool.importlinter.contracts]]
name = "Los workers no dependen de la API"
type = "forbidden"
source_modules = ["app.workers"]
forbidden_modules = ["app.api"]
