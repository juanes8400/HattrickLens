services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hattricklens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hattricklens}
      POSTGRES_DB: hattricklens
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hattricklens"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: [./backend:/code]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-sync:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q sync -c 2 -l info
    volumes: [./backend:/code]
    depends_on: [api]

  worker-compute:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app worker -Q compute -c 2 -l info
    volumes: [./backend:/code]
    depends_on: [api]

  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app beat -l info
    depends_on: [api]

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes: [./frontend:/app, /app/node_modules]
    command: npm run dev -- --host
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
